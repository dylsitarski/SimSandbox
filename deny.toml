# cargo-deny (https://embarkstudios.github.io/cargo-deny/): what the
# dependencies of both workspaces may be. CI runs `cargo deny check` on the
# root workspace and on python/ (`--manifest-path python/Cargo.toml`),
# both from the root; docs/guides/development-setup.md says how to run it
# locally.

[graph]
all-features = false

[advisories]
version = 2
# Every advisory fails the check; an exception goes here with its reason.
ignore = []
yanked = "warn"

[licenses]
version = 2
# Permissive licences only, as found in the dependencies (2026-11-18).
# Add one only if it is permissive, and say so in the change.
# self_cell (Apache-2.0 OR GPL-2.0-only) and r-efi (MIT OR Apache-2.0 OR
# LGPL-2.1-or-later) offer a copyleft licence only as an alternative: the
# permissive one applies. OFL-1.1 and Ubuntu-font-1.0 cover the fonts egui
# embeds (epaint_default_fonts): free to embed and ship, but the fonts
# may not be sold on their own and keep their licence text.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The two workspaces use different subsets of the list.
unused-allowed-license = "allow"
exceptions = []

# Our own crates are not published.
[licenses.private]
ignore = true

[bans]
# Several versions of one crate cost build time and size; reported, not
# refused, since most come from upstream (egui, wgpu, Cranelift).
multiple-versions = "warn"
# Path dependencies between our own crates have no version. cargo-deny
# excuses them (allow-wildcard-paths) only in crates marked
# `publish = false`, which ours are not yet: until they are, a warning.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
