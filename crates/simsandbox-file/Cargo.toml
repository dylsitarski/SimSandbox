[package]
name = "simsandbox-file"
description = "SimSandbox model files: JSON reading and writing (ADR 0007, ADR 0012)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
simsandbox-core = { path = "../simsandbox-core" }
# Formulas of declared parameters (ADR 0043).
simsandbox-expr = { path = "../simsandbox-expr" }
serde = { version = "1", features = ["derive"] }
# Numbers read back exactly as written, so a saved file reproduces its
# run bit for bit (ADR 0039, ADR 0042); the default parser can be one
# unit in the last place off.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The model hash run files record (ADR 0059).
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
simsandbox-eq = { path = "../simsandbox-eq" }
simsandbox-agents = { path = "../simsandbox-agents" }

[lints]
workspace = true
