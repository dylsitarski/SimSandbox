[package]
name = "simsandbox-views"
description = "SimSandbox views: recorded signals, the view registry and the built-in views (ADR 0015)"
version.workspace = true
edition.workspace = true
# egui 0.36 needs Rust 1.95, like simsandbox-app.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Same pinned versions as simsandbox-app (ADR 0008).
egui = { version = "=0.36.2", default-features = false }
egui_plot = "=0.37.0"
# View selections (e.g. profile cuts) are saved as JSON with the view.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Meshes drawn by wgpu in the app's window (ADR 0086); headless builds
# leave it out and draw with egui's painter.
egui-wgpu = { version = "=0.36.2", default-features = false, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
gpu = ["dep:egui-wgpu", "dep:bytemuck"]

[lints]
workspace = true
