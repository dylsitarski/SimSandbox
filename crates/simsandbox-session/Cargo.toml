[package]
name = "simsandbox-session"
description = "SimSandbox sessions: an open model with its recorded history, filters and sweeps, shared by the app, the CLI and the Python API"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
simsandbox-core = { path = "../simsandbox-core" }
simsandbox-expr = { path = "../simsandbox-expr" }
simsandbox-file = { path = "../simsandbox-file" }
simsandbox-views = { path = "../simsandbox-views" }
# The built-in examples load with every block type and view this build has.
simsandbox-eq = { path = "../simsandbox-eq", features = ["views"] }
simsandbox-agents = { path = "../simsandbox-agents" }
serde_json = "1"
# Headless rendering (ADR 0039): egui with its own fonts, as the views
# draw, and PNG output. Same pinned egui as simsandbox-views.
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
png = "0.18"

[lints]
workspace = true
