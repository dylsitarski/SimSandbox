[package]
name = "simsandbox-app"
description = "SimSandbox desktop app (eframe + egui + wgpu, ADR 0008)"
version.workspace = true
edition.workspace = true
# egui 0.36 needs Rust 1.95; the other crates keep the workspace minimum.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "simsandbox-app"
path = "src/main.rs"

[dependencies]
simsandbox-core = { path = "../simsandbox-core" }
simsandbox-agents = { path = "../simsandbox-agents" }
simsandbox-eq = { path = "../simsandbox-eq", features = ["views"] }
simsandbox-expr = { path = "../simsandbox-expr" }
simsandbox-file = { path = "../simsandbox-file" }
simsandbox-views = { path = "../simsandbox-views" }
simsandbox-session = { path = "../simsandbox-session" }
# Pinned deliberately (ADR 0008): egui releases change APIs often.
# egui_plot 0.37 is built against egui 0.36, so eframe stays on 0.36.
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui_plot = "=0.37.0"
# Dockable tabs (ADR 0053); built against egui 0.36.2 like eframe above.
egui_dock = "=0.21.1"
# Native Open/Save dialogs; on Linux through the XDG desktop portal, so no
# GTK headers are needed to build.
rfd = "0.17"
# Filter settings are JSON in model files (ADR 0032).
serde_json = "1"

[lints]
workspace = true
