[workspace]
resolver = "2"
members = [
    "crates/simsandbox-core",
    "crates/simsandbox-expr",
    "crates/simsandbox-compiled",
    "crates/simsandbox-eq",
    "crates/simsandbox-agents",
    "crates/simsandbox-file",
    "crates/simsandbox-cli",
    "crates/simsandbox-views",
    "crates/simsandbox-session",
    "crates/simsandbox-app",
]
# The Python package is its own workspace, built with maturin (python/README.md).
exclude = ["python"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Cranelift (simsandbox-compiled) needs 1.97; egui (the app, views) 1.95.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/dylsitarski/SimSandbox"
authors = ["Dylan Sitarski"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests run numerical code (integrators, typed equations, meshes) that is
# 4–5× slower unoptimised: our own crates are built at opt-level 1 in debug
# and test builds (the test run 77 s → 27 s, a rebuild after an edit
# unchanged, a cold build 187 s → 274 s; measured 2026-11-13). Dependencies
# stay unoptimised: optimising them (faer, the UI) tripled cold builds and
# made the tests no faster. Floating point is IEEE at every level, so
# results are the same bits.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 0
