[workspace]
resolver = "2"
members = [
    "crates/simsandbox-core",
    "crates/simsandbox-expr",
    "crates/simsandbox-eq",
    "crates/simsandbox-agents",
    "crates/simsandbox-file",
    "crates/simsandbox-cli",
    "crates/simsandbox-views",
    "crates/simsandbox-app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/dylsitarski/SimSandbox"
authors = ["Dylan Sitarski"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
